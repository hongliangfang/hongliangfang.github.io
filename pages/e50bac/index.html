data.frame()
read.csv()
read.table()/read.tsv()</p> <p>子集和切片
df[rows, cols]
subset()</p> <p>排序和排名
order()
rank()</p> <p>汇总和连接
aggregate()
tapply()
merge()
join()
rbind()
cbind()</p> <p>重塑
reshape()</p> <p>缺失值
is.omit() -- 有没有？
na.omit() -- 删掉</p> <p>清洗
duplicated() -- 找到重复的行
unique() -- 去掉重复的行</p> <p>subset(data, select = c(&quot;colname1&quot;, &quot;colname2&quot;))
subset(data, colname1 &gt; 10 | colname2 == &quot;value&quot;)
subset(data, !(colname1 &gt; 10))
subset(data, column1 &gt; 10, drop = FALSE) # 只有一行也保留成数据框</p> <p>#排序
subset(data, order(column1))
subset(data, rank(column1) &lt;= 5)</p> <p>order()面对的一般是向量（vector，一行）
order(-dataframe$column1) # 降序排列 / 数值大小 / 因子水平
dataframe[order(dataframe$column1), ] # 升序排序后返回行索引，进行排序
dataframe[order(dataframe$column1, dataframe$column2), ]
head(dataframe[order(dataframe$column1), ], n)</p> <p>rank() # 计算排名，返回排名的数值</p> <p>aggregate(column, by, FUN) # 对相应列的数据进行分组并汇总统计
aggregate(data$column, by = list(data$group), FUN = mean) # sum，max，min，sd，var，
