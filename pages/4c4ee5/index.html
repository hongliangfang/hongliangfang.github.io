这里是我的心</p></blockquote> <p>From 周将《沙漠》，同时，还可以倒着读</p> <blockquote><p>希望我是让你心动的人
而不是权衡利弊分析对错后觉得还不错的人</p></blockquote> <p>我从来不想单身，却又预感晚婚，我在等这世上唯一契合的灵魂</p> <p>我想你了</p> <p>可不可以和我在一起</p> <p>希望你愿意，我值得</p> <p>不要为已失去的东西悲叹，而要对你曾经拥有Ta的时光心存感激。</p> <p>这世界没有真相，只有视角</p> <blockquote><p>尼采</p></blockquote> <p>功名半纸，风雪千山。</p> <blockquote><p>低头走过很多的路，却没多少成就</p></blockquote> <p>拨雪寻春，烧灯续昼。</p> <blockquote><p>还是再努力一把吧！</p></blockquote> <p>苍山负雪，明烛天南。</p> <blockquote><p>日落，雪山~</p></blockquote> <p>虽则如云，匪我思存。</p> <blockquote><p>眼前人影如云，而我的心上人却不在其间...
然而，山川异域，风月同天。</p></blockquote> <p>愿君，如月之恒，如日之升。
愿君，朱颜长似，头上花枝。</p> <p>山不让尘，川不辞盈 ~ 海纳百川</p> <p>愿岁并谢，与长友兮。</p> <blockquote><p>屈原 《九章》</p></blockquote> <p>春天里的事物都太浅薄，我不要春天，不要玫瑰，我只要你</p> <blockquote><p>余秀华</p></blockquote> <p>手我是有的，就是不知道如何碰你</p> <blockquote><p>顾城</p></blockquote> <p>是银河之中最温柔的谜底，我朝朝暮暮偷偷心心念念的你呀</p> <blockquote><p>慕清明</p></blockquote> <p>如果蒙娜丽莎拥有和你一样可爱的微笑，那她将是世界上最伟大的艺术品。</p> <p>没有那么多不合适，爱本身就是包容啊</p> <p>我知道朋友更长久，可是我想牵你的手</p> <p>大鱼海棠里的鼠婆说：&quot;不要预设和别人共渡一生，就自然的相处，命运把你们带到哪里就到哪里。天若有道，自不会让有情人分离，天若无道，人就应该遵循天命。“</p> <p>我承认定数，相信所有的遇见和错过都自有道理，我提醒自己，这世上风物辽阔，日月无期，不止一恨和一爱，还有四海和四季。</p> <p>我不愿意以爱之名绑架任何人。我想要的是，你愿意，我值得。然后在一起日复一日，年复一年。唯愿深不被辜负，深情从一而终。</p> <p>就如杨绛先生所说：&quot;我用真心待你，但不执着于你，活在缘分中，而非关系里。人生各有渡口，各有各舟，流年有爱，就随心花开，如若人走情凉，就攻心自暖。&quot;</p> <p>山海自有归期，风雨自有相逢，意难平终将和解，万事终将如意。好好生活，慢慢遇见，三餐烟火暖，四季皆安然。</p> <p>世界上唯有东西，你都可以估价，唯有生命，生命无价，不要奢望有来生。</p> <p>这短短的一生，我们最终都会失去。你不妨大胆一点去爱一个人，攀一座山，追一个梦。</p> <p>如果要爱，首先你要知道我喜欢什么，讨厌什么，我的性格，我的三观，我的道德，完全了解我，你才有资格说喜欢跟爱，不是么？</p> <p>爱，应该是让你变得温柔且勇敢，而不是让你陷入卑微和纠结。你应该是从爱中获得力量和快乐，而不是花光所有的力量和快乐去爱。</p> <p>你是我侥幸遇到的家人</p> <p>用生活所感去读书，用读书所得去生活</p> <p>只有你想见我的时候，我们的相见才有意义</p> <p>我现在已经有比较欣赏喜欢的人了，只是我一直不知道她觉得我怎么样，对我有什么感觉。</p> <p>还挺难搞的呢。</p></div></div>  <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/c28002/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">诗酒趁年华</div></a> <a href="/pages/9140bd/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">知足常乐</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
