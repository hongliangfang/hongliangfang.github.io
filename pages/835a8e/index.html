4/" target="_blank" rel="noopener noreferrer">Screening of immune-related secretory proteins linking chronic kidney disease with calcific aortic valve disease based on comprehensive bioinformatics analysis and machine learning - PMC (nih.gov)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>Cell-type-specific alternative polyadenylation promotes oncogenic gene expression in non-small cell lung cancer progression</p> <p>在NSCLC中，细胞类型特定的APA，促进致癌基因表达</p> <h3 id="主要内容"><a href="#主要内容" class="header-anchor">#</a> 主要内容</h3> <p>不同细胞类型，之间的APA比较，如果还有正常组织、肿瘤组织、外周血、淋巴结，这些之间还能进行比较哦！</p> <p>基因表达失调的机制有，exon deletion，copy number variation，epigenetic modification</p> <p>在正常细胞中，原癌基因倾向于使用远端poly ( A )位点，这允许miRNA引导的调控。在肿瘤发生过程中，原癌基因开始利用近端poly ( A )位点，产生缩短的3’个UTR。</p> <p>本文的主要流程：<br> <img src="https://s2.loli.net/2024/07/01/auRkoe6O7hfTW5P.png" alt="image.png|700"></p> <p>ps：重点在APA event genes的鉴定上，分门别类归属到各种细胞类型上面！</p> <p>we identified APA events in each cell using the scAPA method</p> <p>poly(A) site usage index (PUI) scores of each gene for each cell type between the control and NSCLC groups using the Student’s t test with p &lt; 0.05</p> <p>30-UTR-shortening and -lengthening event</p> <p>APA-regulated 30-UTR changes in different NSCLC cell types -- 不同组织，不同细胞之间具有异质性</p> <p>Prognostic value of APA-regulated 30-UTR-shortening genes -- APA events 具有预后价值</p> <p>APA can regulate gene expression alteration -- APA 可以影响基因表达</p> <p>APA regulates gene expression through loss of miRNA-binding sites -- 通过缺失miRNA结合位点影响表达</p> <p>用TargetScan Human去搜索缺失的miRNA结合位点数量（应该是输入结合位点片段序列信息，然后去匹配计算吧）</p> <p>如何定义的APA event genes呢？本文是不同细胞间比较基因表达量差异，显著差异的基因叫APA event gene,,,这有点不好理解，这个是specific，high expression的基因，更像是当作身份/状态/功能的Marker基因呀！？</p> <p>PUI values higher，预示着shorter 3’UTR，然后higher gene expression</p> <p>gene expression 和 PUI value of gene之间的相关性系数（correlation coefficient）</p> <ul><li>[ ] luciferase reporter assays，<a href="/01.科研学习/03.实验技术/14.荧光素酶报告实验.html">荧光素酶报告实验</a>，看到好多次了，一直不懂是啥原理，怎么做的</li></ul> <p>Association of SPARC with extracellular matrix remodeling in CAFs -- 重要细胞的重要作用</p> <p><img src="https://s2.loli.net/2024/07/02/BmeX1cPdwUsChKj.png" alt="image.png|500"></p> <p>Requirement of SPARC in lung cancer cells -- 湿实验验证</p> <p>knock down by small interfering RNAs（siRNA）</p> <p>Assessment of the prognostic value of SPARC -- 临床相关性（生存分析，预后判断）</p> <p>SPARC的平均值分高低，K-M生存分析</p> <p>Identification of candidate drugs that interact with SPARC -- 临床相关性（预测潜在治疗药物）</p> <p>RNAactDrug &amp; GDSC，取交集</p> <p><img src="https://s2.loli.net/2024/07/02/uMzXYjstETOxw7y.png" alt="image.png|800"></p> <p>基因表达数量 和 半数抑制浓度 之间的 相关性分析，R越大说明治疗抵抗可能性越大，多种药物的治疗抵抗；R 越小说明治疗效果越好！（横坐标 -- SPARC的表达量，纵坐标 -- 对应药物的敏感性）</p> <p>Distinct drug responses of patients with different expression of SPARC --  临床相关性（验证潜在治疗药物）</p> <p>Cox regression analysis for the high-SPARC group and the low-SPARC group<br> <img src="https://s2.loli.net/2024/07/02/H6VNXTLscqlmvAY.png" alt="image.png|700"></p> <p>生存分析还可以这样分组后再判断（表达高低、治疗/未治疗）
<img src="https://s2.loli.net/2024/07/02/tGU1ARsnQL6bkpo.png" alt="image.png|700"></p> <p>Discussion</p> <p>treatment stratification</p> <p>长的3’UTR时间，短的3‘UTR时间，分别进行了研究</p> <p>CancerMine database，可以判断是否属于致癌基因 / oncogene category</p> <h3 id="重要方法"><a href="#重要方法" class="header-anchor">#</a> 重要方法</h3> <p>文章：<a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6821429/" target="_blank" rel="noopener noreferrer">Cell-type-specific analysis of alternative polyadenylation using single-cell transcriptomics data - PMC (nih.gov)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>Github：<a href="https://github.com/ElkonLab/scAPA" target="_blank" rel="noopener noreferrer">ElkonLab/scAPA: This is a package and a shell script for alternative polyadenylation (APA) analysis of 3' tag single-cell RNA-seq data. (github.com)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>intercellular，细胞之间</li> <li>intracellular，细胞内部</li></ul> <p>Comparative Toxicogenomics Database (CTD; http://ctdbase.org/) and RNAactDrug database (http://bio-bigdata.hrbmu.edu.cn/RNAactDrug/)</p> <h2 id="aging-atlas"><a href="#aging-atlas" class="header-anchor">#</a> Aging atlas</h2> <p>Aging atlas reveals cell-type-specific effects of pro-longevity strategies</p> <p>衰老图集揭示细胞类型特定的，促进长寿策略的，效应</p> <p>已经发现了一些能够延长寿命的策略，但是这些策略对不同的组织起作用的机制还不清楚</p> <h3 id="主要结果"><a href="#主要结果" class="header-anchor">#</a> 主要结果</h3> <p>Developing snRNA-seq platform for adult worms -- 测序方法</p> <p>C. elegans，Caenorhabditis elegans，秀丽隐杆线虫</p> <p><img src="https://s2.loli.net/2024/07/03/WKRd4AkSphvi7HQ.png" alt="image.png|400"></p> <p>fluorescence-activated cell sorting (FACS)，荧光激活细胞分选</p> <p>Revealing cell-type-specific molecular and functional signatures -- 分子和功能 特征</p> <p>后续的结果是关于秀丽隐杆线虫的各种特征，和所研究内容很不相关，所以不看了，只注意APA相关的结果。</p> <p>Genome-wide profiling of age-related APA changes -- 基因组范围内的，年龄相关的，APA事件</p> <p>In accordance with this previous finding, we found that ret-1 in muscle and intestine preferentially uses proximal and distal APA sites, respectively (Extended Data Fig. 7a,b), and, as age increases, the APA preference in the intestine shifts from distal to proximal, becoming like that in the muscle.</p> <p>We then applied the <strong>polyApipe</strong> tool to systemically profile APA types, proximal versus distal adenylation site in pre-mRNAs</p> <p>鉴定的APA事件示意图：<br> <img src="https://s2.loli.net/2024/07/03/RihIDywv8j1M9TZ.png" alt="image.png|400"></p> <p>It is known that APA preference is regulated by changes in cell proliferation and differentiation, and increased distal usage is often associated with cell differentiation37.</p> <p>Unveiling tissue-specific regulation of APA by pro-longevity strategies -- 通过延长寿命策略，提示APA的组织特异性调控</p> <p>We found that the age-related increase in the utilization of the distal APA sites was overall suppressed in the long-lived strains (Fig. 7d). （“年老”细胞使用远端APA位点被“长寿”药给抑制了）
<img src="https://s2.loli.net/2024/07/03/GXm8JBs3axQ2CVq.png" alt="image.png|600"></p> <h3 id="重要方法-2"><a href="#重要方法-2" class="header-anchor">#</a> 重要方法</h3> <p><strong>Velocity / PAGA</strong></p> <p>To investigate the developmental trajectory of germline cells, we performed a range of analyses using scVelo (0.2.4) and CellRank (1.5.1). The processed germline Seurat object was converted to an AnnData object, and the top 5,000 highly variable genes were selected for velocity calculation. We used the first 30 principal components and set the neighbor number to 50 to perform the velocity analysis. This approach allowed us to gain insights into the changes in gene expression over time and identify the major differentiation pathways and cellular lineages. In addition to the velocity analysis, we used CellRank to perform PAGA analysis with weight of connectivities set to 0.3. This method summarizes the connectivity between the clusters of cells and identifies the major cellular lineages and terminal states.</p> <p><strong>APA analysis</strong></p> <p>To analyze APA in our 10x Genomics scRNA-seq dataset, we used the R package polyApipe with default settings. We used the C. elegans genome (WS282) to generate APA site references for the analysis.</p> <p>To investigate age-related APA site preference changes in WT worms, we combined the day 12 and day 14 samples owing to cell number limitations. We then performed a comparison among day 1, day 6 and day 12/14, selecting genes that were expressed in at least 10% of the cells in all ages. This analysis allowed us to identify genes with age-related changes in APA site preference, providing insights into the molecular mechanisms underlying aging in C. elegans.</p> <h2 id="ovarian-cancer"><a href="#ovarian-cancer" class="header-anchor">#</a> Ovarian cancer</h2> <p>Detection of isoforms and genomic alterations by high-throughput full-length single-cell RNA sequencing in ovarian cancer</p> <p>通过高通量全长单细胞RNA测序，检测卵巢癌中的，<code>异构体</code>和基因组变异</p> <h3 id="主要结论"><a href="#主要结论" class="header-anchor">#</a> 主要结论</h3> <p>是不是可以顺便把单细胞的可变剪切给分析一下呢？</p> <p><a href="https://baike.baidu.com/item/%E9%97%B4%E7%9A%AE%E7%BB%86%E8%83%9E" target="_blank" rel="noopener noreferrer">间皮细胞<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <blockquote><p>胸膜，腹膜，心包膜表面的单层细胞扁平上皮，间皮细胞的主要功能是分泌一些细胞外基质，在不同的器官之间，器官和胸膜/腹膜之间，起到保护和润滑作用</p></blockquote> <p>单细胞测序，从原理上来看，大多数的测序长度是比较短的，这就不可避免地引起一些基因比对过程中的假阳性（比较短的时候和某个基因重叠比较多，但是全长可能是另一个基因），或者是忽略一些基因结构变异（基因融合恰好被打断了）</p> <p>融合突变是，癌症免疫或者癌症疫苗，一个很好的靶点</p> <p>这个研究发现，大概有20%的编码基因，是不编码蛋白的
ps：那就有几个问题，如何判断编码基因是否处于编码状态的？如果真的有20%的话，高估的基因表达量是否有偏好？这对于后续的转录组差异分析，影响蛮大的</p> <p>germline and somatic mutations，生殖细胞和体细胞的突变，基因组的测序是能够分析这种信息的，怎么分析的来着？</p> <p>Long-read scRNA-seq creates a catalog of isoforms in ovarian cancer patient-derived tissue samples -- 单细胞长序列，创造了异构体的目录</p> <p>HGSOC，high-grade serous ovarian cancer，高级别浆液性卵巢癌</p> <p>取得组织样本是：有癌细胞转移的大网膜组织，没转移癌细胞的大网膜组织</p> <p>对异构体进行分类和计算特征</p> <ul><li>可变剪切参考数据库：<code>SQANTI</code>: extensive characterization of longread transcript sequences for quality control in full-length transcriptome identification and quantification. Genome Res. 28, 396–411 (2018)</li></ul> <p>判断完整性，分别参考比较了5‘和3’端的情况：</p> <ul><li>5‘端数据库：<code>FANTOM5 CAGE profiles</code> of human and mouse reprocessed for GRCh38 and GRCm38 genome assemblies. Sci. Data 4, 170107 (2017).</li> <li>3’端数据库：<code>PolyASite 2.0</code>: a consolidated atlas of polyadenylation sites from 3’ end sequencing. Nucleic Acids Res. 48, D174–D179 (2020).</li></ul> <p>只有MANE35包含筹备好的有代表性的转录本，在GENECODE和RefSeq两个数据库之间交叉验证之后，才有更好的3‘和5’端，95%的确定</p> <blockquote><p>Only the ‘Matched Annotation from NCBI and EMBL-EBI’ (MANE35) containing curated representative transcripts cross-validated between the GENCODE and RefSeq database had a better 3’ and 5’ validation of 95%.</p></blockquote> <p>异构体分类：<br> <img src="https://s2.loli.net/2024/07/05/NcVrvQ3EjPYMmq7.png" alt="image.png|500"></p> <p>Long-read sequencing allows for short-read-independent cell-type identification -- 长读测序允许，不依赖短读的，细胞类型鉴定</p> <p>Jaccard distance between clusters → 细胞类型的reads，transcripts，genes之间的相关性<br> <img src="https://s2.loli.net/2024/07/05/N4TAqfDjhcyFbwU.png" alt="image.png|600"></p> <blockquote><p>Jaccard distance of cell populations in different UMAP embeddings: short readsgene level versus long reads— gene level (left), short reads—gene level versus long reads—isoform level (middle), long reads—gene level versus long reads—isoform level (right). Long reads—gene-level UMAP cohort visualizations of cells with at least onegermline</p></blockquote> <p>应该是从Seurat包中的UMAP之后得到的信息，去做相关性分析</p> <p>Long-read sequencing captures germline and somatic mutations and identifies increased neojunctions in tumor cells -- 生殖细胞和体细胞突变，肿瘤细胞中的新连接</p> <p>生殖细胞突变，父母给的；体细胞突变，自己造的</p> <blockquote><p>Germline mutations are expected in all cell types, whereas somatic mutations should be present only in tumor cells</p></blockquote> <p>癌细胞中的异构体，转录本种类会很多，但是这并不会增加癌细胞中检测到的平均UMI数量（提示Con vs Tumor cells 表达量并不一定会有显著差异）</p> <p>文中的解释是这样讲的：这就意味着癌细胞表达了更多低丰度的异构体，提示着更广的异构体多样性和更广的细胞功能和控制。</p> <blockquote><p>This means that cancer cells express more low-abundant isoforms suggesting wider isoform diversity and broader cellular functions, and controls.</p></blockquote> <p>同时，癌细胞中的novel isoforms and neojunctions (NNC)，占比也更高些。</p> <p>生殖细胞突变，分布在各种细胞中；体细胞突变，集中分布在肿瘤细胞中
<img src="https://s2.loli.net/2024/07/05/Ak7u8IQpF4Ctwnx.png" alt="image.png|600"></p> <p>QC metrics，指控 <code>指标</code></p> <p>癌细胞比其他正常细胞，表达多了两倍多的，unique isoforms → 暗示着癌细胞转录组的多样性，和癌症特定的新剪切本</p> <p>ps：展示出来的这些<code>统计图</code>，需要细胞，细胞种类，基因，转录本，异构体，等这几列信息，最最重要的是，在方法中找到如何比对统计基因、转录本，异构体信息的，以及怎样和降维聚类注释联系在一起的。</p> <p>Tumor microenvironment shows epithelial-to-mesenchymal transition through TGFβ-driven miR-29 downregulation -- 上皮-间质转化</p> <p>转移位置的（TME），和未转移位置（Distal）的各种基质细胞，之间比较，也会有些有意思的发现 -- 另外，UMAP之间的“连接”，也暗示着分化的轨迹/可能性<br> <img src="https://s2.loli.net/2024/07/05/M971JRB6UoaWNp2.png" alt="image.png|700"></p> <p>使用数据库研究找几个3‘端延长的胶原编码基因的，miRNA作用靶点：<br> <code>miRDB</code>: an online database for prediction of functional microRNA targets. Nucleic Acids Res</p> <p>肿瘤细胞中，很多3’端延长的基因，又有不少被miRNA抑制，这个结论有啥意义呐？</p> <p>然后，EMT信号，上皮间充质转化的信号会高些，从规则朝向形态稳定的上皮，转变成圆滑，侵袭性高，转移性强的间充质？</p> <p>关于这个图，我是真没看懂

In the ovarian cancer TCGA RNA dataset, the expression levels of exons surrounding breakpoints of IGF2BP2 and TESPA1 did not change (Supplementary Fig. 9a, b), and the overall expression of the genes did not correlate in any patient, suggesting that we detected an uncommon, patient-specific fusion (Supplementary Fig. 9c)</p> <h3 id="重要方法-3"><a href="#重要方法-3" class="header-anchor">#</a> 重要方法</h3> <p>Alternative polyadenylation (APA) analysis. To analyze differences between 3’UTR lengths, we used a modified version of DaPars2 (https://github.com/ArthurDondi/DaPars2_LR), with an APA site detection adapted to long-read coverage.</p> <p>Differential isoform tests. Differential isoform testing was performed using a χ2 test as previously described in Scisorseq26 (v.0.1.2). Briefly, counts for each isoform ID were assigned to individual cell types, and genes were discarded if they were mitochondrial, ribosomal, or if they did not reach sufficient depth per condition (25 reads per condition per gene).</p> <p>Fusion discovery. Mapped reads from isoform classification were pooled. We called reads mapping to two separate genes at a distance of more than 100,000 bp or to different chromosomes using fusion_finder.py (cDNA_Cupcake package, https://github.com/ Magdoll/cDNA_Cupcake/releases/tag/v28.0.0) with parameters –min_locus_coverage_bp 200 -d 1000000.</p> <p>scDNA analysis
