blockquote> <p>Lazy → reduce screen time</p> <blockquote><p>有点懒的时候呢，就是赖着想摆烂，少看屏幕</p></blockquote> <p>Burnt out → read</p> <blockquote><p>心理，生理，情绪上耗竭的时候呢，去阅读</p></blockquote> <p>看到一句话嘞！</p> <p>悲观是远见，乐观是智慧~</p></div></div>  <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4c4ee5/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">纸短情长</div></a> <a href="/pages/7e35d7/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">2023</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
