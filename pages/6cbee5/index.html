for(i in 1:nrow(david)){

  subtable &lt;- subset(genelist,ID %in% genes )

  down &lt;- sum(subtable$logFC &lt; 0)

} 

GOBar(david, display = 'multiple')

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br></div></div><p>还蛮好看的呢！</p> <h2 id="roc-auc"><a href="#roc-auc" class="header-anchor">#</a> ROC &amp; AUC</h2> <p>能画出来，但是不理解这个计算原理，目的，使用方法，需要再进一步学习，从<a href="/01.科研学习/01.阅读记录/19.PDAC biomarkers.html">PDAC biomarkers</a>这个想到要进一步了解。</p> <div class="language- line-numbers-mode"><pre class="language-text"><code># 安装并加载pROC包
install.packages(&quot;pROC&quot;)
library(pROC)

# 设置随机种子以确保结果的可重复性
set.seed(123)

# 创建示例数据
n &lt;- 100
Outcome &lt;- sample(c(0, 1), n, replace = TRUE)
Feature1 &lt;- rnorm(n)
Feature2 &lt;- rnorm(n)

# 将数据存储为数据框
data &lt;- data.frame(Outcome, Feature1, Feature2)

# 使用逻辑回归拟合模型
model &lt;- glm(Outcome ~ Feature1 + Feature2, data = data, family = &quot;binomial&quot;)

# 生成预测
predictions &lt;- predict(model, type = &quot;response&quot;)
data$PredictedProbability &lt;- predictions

# 计算ROC曲线的坐标点
roc_obj &lt;- roc(data$Outcome, data$PredictedProbability)

# 计算AUC
auc_value &lt;- auc(roc_obj)
print(paste(&quot;AUC is:&quot;, auc_value))

# 绘制ROC曲线，并在图上显示AUC
plot(roc_obj, 
     main = &quot;ROC Curve&quot;,
     col = &quot;blue&quot;,
     print.thres = &quot;best&quot;, 
     #print.thres.pattern = &quot;Optimal threshold: %.2f&quot;
     )
text(0.5, 0.5, labels = paste(&quot;AUC =&quot;, round(auc_value, 3)), pos = 4, offset = 0.5, cex = 0.7)

# 1.模拟数据：
import matplotlib.pyplot as plt
import numpy as np
import pandas as pd 

#模拟数据并创建一个5样本细胞数据集   
status = ['Normal','FL','FH','DH','Tumor']   
group = ['T','B','NK','macrophage','monocyte']   

data = {'monocyte':[0.2,0.2,0.15,0.2,0.1],
        'macrophage':[0.4,0.3,0.35,0.3,0.5],
        'NK':[0.2,0.15,0.1,0.12,0.05],
        'B':[0.1,0.25,0.05,0.22,0.2],
        'T':[0.1,0.1,0.35,0.16,0.15]}   

data = pd.DataFrame(data) 
colors = ['#E76BF3','#00B0F6','#00BF7D','#A3A500','#F08784'] #配色  

# 2.绘制柱状堆叠图的大致轮廓

bottom = np.zeros(5)   
fig,axes = plt.subplots(figsize=(6,5),ncols=2,width_ratios=[5,1])   
ax1,ax2 = axes.ravel()   
ax2.axis('off')   
p=[]   
for k,i in enumerate(group):
    patches=ax1.bar(status,data[i].tolist(),label=i,color=colors[k],bottom=bottom)
